[project]
name = "lap-vision-f1"
version = "0.1.0"
description = "Internal Fast-F1 ingestion and cache service for Lap Vision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.136",
    "starlette<1.1",
    "uvicorn[standard]>=0.30.0",
    "fastf1>=3.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
