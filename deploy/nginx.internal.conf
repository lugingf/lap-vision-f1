worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8010;
        server_name _;

        client_max_body_size 16m;

        location / {
            # A session FastF1 has never loaded takes minutes to build, and the default read
            # timeout is a minute: every cold sprint and every recompute died here with a 504
            # while the work carried on behind it, so the site reported an error for something
            # that was merely slow. The service answers in milliseconds once warm; these ceilings
            # only ever apply to the first caller for a session.
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://f1_upstream;
        }
    }
}
